<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patyk Darts Corporation</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --text-color: #fff;
            --accent-color: #ff4d4d;
            --row-hover: #0f3460;
            --border-color: #0f3460;
        }

        body.light-mode {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333;
            --accent-color: #d93838;
            --row-hover: #f0f0f0;
            --border-color: #ddd;
        }

        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: var(--bg-color); color: var(--text-color); max-width: 600px; margin: auto; transition: background 0.3s, color 0.3s; }
        h1 { text-align: center; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        
        /* Opcja 3: Pulsowanie logo */
        @keyframes heartbeat {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 15px 10px rgba(255, 77, 77, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }
        .logo { display: block; margin: 0 auto 20px auto; max-width: 150px; border-radius: 50%; border: 3px solid var(--accent-color); animation: heartbeat 2s infinite; }
        
        select { width: 100%; padding: 15px; margin-bottom: 25px; font-size: 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--container-bg); color: var(--text-color); cursor: pointer; transition: 0.3s; }
        
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        #theme-btn { background: var(--container-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #theme-btn:hover { background: var(--row-hover); }

        .table-container { overflow-x: auto; background: var(--container-bg); padding: 15px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s; }
        
        @keyframes szybkieTla {
            0%   { background-image: url('tlo.jpg'); }
            14%  { background-image: url('tlo2.jpg'); }
            28%  { background-image: url('tlo3.jpg'); }
            42%  { background-image: url('tlo4.jpg'); }
            57%  { background-image: url('tlo5.jpg'); }
            71%  { background-image: url('tlo6.jpg'); }
            85%  { background-image: url('tlo7.jpg'); }
            100% { background-image: url('tlo.jpg'); }
        }

        .table-container.bulla-bg { animation: szybkieTla 0.9s infinite; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .table-container.bulla-bg table { background-color: rgba(22, 33, 62, 0.85); }
        body.light-mode .table-container.bulla-bg table { background-color: rgba(255, 255, 255, 0.85); }

        table { width: 100%; border-collapse: collapse; min-width: 250px; }
        th { padding: 12px; background: var(--accent-color); color: white; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); transition: 0.3s; }
        td:last-child { font-weight: bold; color: var(--accent-color); text-align: right; }

        /* Opcja 1: Wjeżdżanie wierszy */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        tbody tr { 
            opacity: 0; 
            animation: slideIn 0.4s ease forwards; 
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Opcja 4: Wypukły wiersz po najechaniu */
        tbody tr:hover { 
            transform: scale(1.02) translateY(-2px); 
            background-color: var(--row-hover); 
            box-shadow: 0 8px 15px rgba(0,0,0,0.4); 
            position: relative; 
            z-index: 10; 
        }
        body.light-mode tbody tr:hover {
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        tbody tr:hover td { border-bottom-color: transparent; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="theme-btn">☀️ Jasny motyw</button>
    </div>

    <img src="logo.png" alt="Logo PDC" class="logo">
    
    <h1>PATYK DARTS CORPORATION</h1>

    <select id="wybor">
        <option value="glowna">Tabela Główna PDC</option>
        <option value="mecze">Tabela za mecze</option>
        <option value="wybrykowa">Tabela Wybrykowa</option>
        <option value="minigier">Tabela Minigier</option>
        <option value="frekwencja">Tabela Frekwencji</option>
        <option value="srednia">Najwyższa Średnia</option>
        <option value="dable">% Dabli</option>
        <option value="checkout">Najwyższy Checkout</option>
        <option value="lotka">Najszybsza Lotka</option>
        <option value="avg">Średnia</option>
        <option value="first9">Średnia pierwszych 9 lotek</option>
        <option value="bulla">% Legów do bulla</option>
        <option value="winrate">% Zwycięstw</option>
    </select>

    <div class="table-container" id="kontener">Ładowanie danych...</div>

    <script>
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeBtn.innerText = '🌙 Ciemny motyw';
            } else {
                themeBtn.innerText = '☀️ Jasny motyw';
            }
        });

        let workbook;
        let odtwarzacz = new Audio('muzyka.mp3');
        
        async function init() {
            try {
                const res = await fetch('data.xlsm');
                const data = await res.arrayBuffer();
                workbook = XLSX.read(data, { type: 'array' });
                pokazTabele("glowna");
            } catch (e) {
                document.getElementById('kontener').innerHTML = "Błąd: Nie znaleziono pliku data.xlsm w folderze.";
            }
        }

        // Opcja 2: Funkcja zliczająca liczby w czasie rzeczywistym
        function animujLiczby() {
            const komorki = document.querySelectorAll('.wartosc-wyniku');
            komorki.forEach(komorka => {
                const docelowa = parseFloat(komorka.getAttribute('data-cel'));
                const typ = komorka.getAttribute('data-typ');
                
                const czasTrwania = 800; // animacja trwa 0.8 sekundy
                const krokCzasowy = 20; 
                const lacznieKrokow = czasTrwania / krokCzasowy;
                const wartoscKroku = docelowa / lacznieKrokow;
                
                let aktualna = 0;
                let licznik = 0;

                const animacja = setInterval(() => {
                    licznik++;
                    aktualna += wartoscKroku;
                    
                    if (licznik >= lacznieKrokow || aktualna >= docelowa) {
                        aktualna = docelowa;
                        clearInterval(animacja);
                    }
                    
                    if (typ === 'procent') {
                        komorka.innerText = Math.round(aktualna) + "%";
                    } else if (typ === 'dziesietny') {
                        komorka.innerText = aktualna.toFixed(2);
                    } else {
                        komorka.innerText = Math.round(aktualna);
                    }
                }, krokCzasowy);
            });
        }

        function pokazTabele(typ) {
            const arkusz = workbook.Sheets[workbook.SheetNames[0]];
            let zakres = "";
            
            if(typ === "glowna") zakres = "B5:C13";
            else if(typ === "mecze") zakres = "G5:H13";
            else if(typ === "wybrykowa") zakres = "L5:M13";
            else if(typ === "minigier") zakres = "Q5:R13";
            else if(typ === "frekwencja") zakres = "V5:W13";
            else if(typ === "srednia") zakres = "AA5:AB13";
            else if(typ === "dable") zakres = "AF5:AG13";
            else if(typ === "checkout") zakres = "B18:C26";
            else if(typ === "lotka") zakres = "G18:H26";
            else if(typ === "avg") zakres = "L18:M26";
            else if(typ === "first9") zakres = "Q18:R26";
            else if(typ === "bulla") zakres = "V18:W26";
            else if(typ === "winrate") zakres = "AA18:AB26";

            const dane = XLSX.utils.sheet_to_json(arkusz, { range: zakres, header: 1 });
            const tabeleProcentowe = ["frekwencja", "dable", "bulla", "winrate"];
            const doZaokraglenia = ["srednia", "avg", "first9"];
            
            let html = '<table><thead><tr><th>Zawodnik</th><th>Wynik</th></tr></thead><tbody>';
            let opoznienie = 0;
            
            dane.forEach(r => { 
                if(r[0]) {
                    let wartosc = r[1] ?? 0;
                    let typWartosci = 'zwykly';
                    let cel = wartosc;
                    
                    if (tabeleProcentowe.includes(typ) && typeof wartosc === 'number' && wartosc <= 1) {
                        typWartosci = 'procent';
                        cel = wartosc * 100;
                    } else if (doZaokraglenia.includes(typ) && typeof wartosc === 'number') {
                        typWartosci = 'dziesietny';
                    }
                    
                    html += `<tr style="animation-delay: ${opoznienie}s">
                                <td>${r[0]}</td>
                                <td class="wartosc-wyniku" data-cel="${cel}" data-typ="${typWartosci}">0</td>
                             </tr>`; 
                             
                    opoznienie += 0.08; // Każdy następny wiersz pojawia się 0.08s później
                }
            });
            
            html += '</tbody></table>';
            
            const kontener = document.getElementById('kontener');
            kontener.innerHTML = html;
            
            // Uruchomienie animacji odliczania od zera
            animujLiczby();
            
            if (typ === 'bulla') {
                kontener.classList.add('bulla-bg');
                odtwarzacz.currentTime = 0; 
                odtwarzacz.play().catch(() => console.log("Przeglądarka zablokowała autoodtwarzanie."));
            } else {
                kontener.classList.remove('bulla-bg');
                odtwarzacz.pause();
            }
        }

        document.getElementById('wybor').addEventListener('change', (e) => pokazTabele(e.target.value));
        init();
    </script>
</body>
</html>
